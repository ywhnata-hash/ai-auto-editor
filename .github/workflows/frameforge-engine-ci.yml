name: FrameForge editor engine CI

on:
  push:
    branches: [main, cutaway-engine-migration]
    paths:
      - "engine/cutaway/**"
      - ".github/workflows/frameforge-engine-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/cutaway/**"
      - ".github/workflows/frameforge-engine-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/cutaway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: engine/cutaway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload static editor build
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-web-static
          path: engine/cutaway/apps/web/out/
          if-no-files-found: error
          retention-days: 14
